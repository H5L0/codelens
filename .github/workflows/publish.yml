# 版本 tag 触发发布：推一个 vX.Y.Z 标签，测试通过且标签与 package.json 版本
# 一致时自动发布到 npm。
# 认证走 npm 的受信发布（OIDC），仓库里不放任何密钥：在 npmjs.com 上打开这个包，
# Settings → Trusted publishing，填 owner `H5L0`、repository `codelens`、
# workflow `publish.yml`，environment 留空即可。
name: Publish

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # 受信发布（OIDC）需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 受信发布要求 npm >= 11.5.1，node 22 自带的 npm 10 不满足，这里装 11.x 而不是 latest（npm 12 要求更新的 node）
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the tag against package.json
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm, nothing to publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
