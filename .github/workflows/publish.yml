# 版本 tag 触发发布：推一个 vX.Y.Z 标签，检查通过后暂存到 npm，在 npm 上批准后才正式发布。
name: Publish

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm 暂存发布需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 暂存发布要求 npm >= 11.5.1，node 22 自带的 npm 10 不满足，这里装 11.x 而不是 latest（npm 12 要求更新的 node）
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the tag against package.json
        id: check
        run: |
          oidc="missing"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then oidc="available"; fi
          echo "npm $(npm --version), OIDC endpoint: $oidc"

          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm, nothing to publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the release on npm
        if: steps.check.outputs.skip == 'false'
        # OIDC 令牌交换失败默认只表现为 ENEEDAUTH，verbose 级别才会给出真正的原因
        run: npm stage publish --access public --loglevel=verbose

      - name: Point to the review page
        if: steps.check.outputs.skip == 'false'
        run: |
          name="$(node -p "require('./package.json').name")"
          echo "::notice::$name is staged on npm and waits for review at https://www.npmjs.com/package/$name"
